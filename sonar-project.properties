sonar.projectKey=pgatzka_autodrive-editor
sonar.organization=pgatzka

sonar.sources=src,electron
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=dist/**,release/**,coverage/**,node_modules/**,tests/assets/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# thin DOM/IPC wrappers and views are covered by the UI smoke test, not by unit
# tests, so they are excluded from the coverage measurement (see vitest.config.ts)
sonar.coverage.exclusions=src/main.tsx,src/App.tsx,src/ui/**,src/files/**,src/testing/**,src/editor/EditorCanvas.tsx,src/editor/useCanvasInteraction.ts,src/editor/useKeyboardShortcuts.ts,electron/**
