# Release pipeline: test -> prepare draft -> build all OSes in parallel -> publish/prune
#
# - Nothing is released unless the test suite passes first.
# - Every push to main ships installers for Windows/Linux/macOS tagged
#   v<next-patch>-dev.<run>. The builds upload into a draft so nothing
#   half-finished is visible; once all assets are attached the finalize job
#   PUBLISHES it as a prerelease — the app's "unstable" channel, visible to
#   the anonymous GitHub API, no token required. Older dev builds (and their
#   tags) are pruned automatically.
# - Pushing a tag v* ships the same installers to a DRAFT release with that
#   clean version. Publishing that draft on GitHub manually makes it the new
#   stable release (the app's "stable" channel). Afterwards bump the version
#   in package.json on main.
#
# The draft release is created once, up front, in the prepare job — the three
# platform builds then upload into it concurrently without racing to create it.
name: Release

on:
  push:
    branches: [main]
    # dev tags are created by the pipeline itself; only clean v* tags build stable releases
    tags: ["v*", "!v*-dev.*"]
  workflow_dispatch:

permissions:
  contents: write

# supersede queued/running dev builds on rapid main pushes; never cancel tag builds
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Run model tests
        run: CHROMIUM_PATH="$(which google-chrome)" npm test

  prepare:
    name: Prepare draft release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          else
            BASE=$(node -p "require('./package.json').version")
            NEXT=$(node -p "const [a,b,c]='$BASE'.split('.').map(Number); [a,b,c+1].join('.')")
            echo "version=${NEXT}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release (reused if it already exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          CHANNEL: ${{ steps.v.outputs.channel }}
        run: |
          TAG="v${VERSION}"
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r --arg tag "$TAG" '[.[] | select(.draft and .tag_name == $tag)] | first | .id // empty')
          if [ -z "$EXISTING" ]; then
            PRERELEASE=$([ "$CHANNEL" = "dev" ] && echo true || echo false)
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" \
              -f name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -F draft=true \
              -F prerelease="$PRERELEASE" \
              -F generate_release_notes=true > /dev/null
            echo "Created draft release $TAG"
          else
            echo "Reusing existing draft release $TAG (id $EXISTING)"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set build version
        run: npm version --no-git-tag-version --allow-same-version "${{ needs.prepare.outputs.version }}"

      - name: Build renderer
        run: npm run build

      - name: Package and upload to the draft release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no code signing certificates configured
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  finalize:
    name: Publish dev prerelease and prune stale dev builds
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.channel == 'dev'
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        # Publishing turns the fully-uploaded draft into a prerelease that the
        # anonymous GitHub API can see (drafts never are), so the app's
        # unstable channel needs no token. Pruning only touches dev builds with
        # a LOWER run number, so an overlapping newer run can never be deleted
        # by an older run finishing late.
        run: |
          TAG="v${VERSION}"
          RELEASES=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")

          ID=$(echo "$RELEASES" | jq -r --arg tag "$TAG" \
            '[.[] | select(.tag_name == $tag and .draft)] | first | .id // empty')
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$ID" \
              -F draft=false -F prerelease=true > /dev/null
            echo "Published $TAG as prerelease"
          fi

          # match on tag OR name: drafts created without an explicit tag carry a
          # placeholder tag_name (untagged-...) and only the name has the version
          echo "$RELEASES" \
            | jq -r --arg tag "$TAG" --argjson cur "${GITHUB_RUN_NUMBER}" '
                .[]
                | select(.tag_name != $tag)
                | select(.draft or .prerelease)
                | (((.name // "") + " " + (.tag_name // ""))) as $label
                | select($label | test("-dev\\."))
                | select(($label | capture("-dev\\.(?<n>[0-9]+)").n | tonumber) < $cur)
                | "\(.id) \(.tag_name)"' \
            | while read -r id tag; do
                echo "Deleting stale dev build $tag (id $id)"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$tag" > /dev/null 2>&1 || true
              done
