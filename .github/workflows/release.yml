# Release pipeline: test -> prepare draft release -> build all OSes in parallel -> prune
#
# - Nothing is released unless the test suite passes first.
# - Every push to main ships installers for Windows/Linux/macOS to a DRAFT
#   prerelease tagged v<next-patch>-dev.<run> (the app's "unstable" channel).
#   Older dev drafts are pruned automatically.
# - Pushing a tag v* ships the same installers to a draft release with that
#   clean version. Publishing that draft on GitHub makes it the new stable
#   release (the app's "stable" channel). Afterwards bump the version in
#   package.json on main.
#
# The draft release is created once, up front, in the prepare job — the three
# platform builds then upload into it concurrently without racing to create it.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# supersede queued/running dev builds on rapid main pushes; never cancel tag builds
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Run model tests
        run: CHROMIUM_PATH="$(which google-chrome)" npm test

  prepare:
    name: Prepare draft release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          else
            BASE=$(node -p "require('./package.json').version")
            NEXT=$(node -p "const [a,b,c]='$BASE'.split('.').map(Number); [a,b,c+1].join('.')")
            echo "version=${NEXT}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release (reused if it already exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          CHANNEL: ${{ steps.v.outputs.channel }}
        run: |
          TAG="v${VERSION}"
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r --arg tag "$TAG" '[.[] | select(.draft and .tag_name == $tag)] | first | .id // empty')
          if [ -z "$EXISTING" ]; then
            PRERELEASE=$([ "$CHANNEL" = "dev" ] && echo true || echo false)
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" \
              -f name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -F draft=true \
              -F prerelease="$PRERELEASE" \
              -F generate_release_notes=true > /dev/null
            echo "Created draft release $TAG"
          else
            echo "Reusing existing draft release $TAG (id $EXISTING)"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set build version
        run: npm version --no-git-tag-version --allow-same-version "${{ needs.prepare.outputs.version }}"

      - name: Build renderer
        run: npm run build

      - name: Package and upload to the draft release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no code signing certificates configured
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  finalize:
    name: Prune stale dev drafts
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.channel == 'dev'
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        # only prune drafts with a LOWER run number, so an overlapping newer
        # run's draft can never be deleted by an older run finishing late
        run: |
          TAG="v${VERSION}"
          # match on tag OR name: drafts created without an explicit tag carry a
          # placeholder tag_name (untagged-...) and only the name has the version
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r --arg tag "$TAG" --argjson cur "${GITHUB_RUN_NUMBER}" '
                .[]
                | select(.draft and .tag_name != $tag)
                | (((.name // "") + " " + (.tag_name // ""))) as $label
                | select($label | test("-dev\\."))
                | select(($label | capture("-dev\\.(?<n>[0-9]+)").n | tonumber) < $cur)
                | .id' \
            | while read -r id; do
                echo "Deleting stale dev draft id $id"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
              done
