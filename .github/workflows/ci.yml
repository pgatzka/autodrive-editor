name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# a newer push to the same ref supersedes the running build
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Run model tests
        # the tests drive a real browser; the runner ships Google Chrome
        run: CHROMIUM_PATH="$(which google-chrome)" npm test
